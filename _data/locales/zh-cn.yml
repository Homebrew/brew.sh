    question: "\U0001F527 Homebrew 能做什么？"
    what: Homebrew 在 macOS、Linux 和 WSL 上安装您所需的<a href="https://formulae.brew.sh/formula/" title="Homebrew 软件包列表">命令行工具和应用程序</a>。
    how: 'Homebrew 不会将文件安装到其 <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">安装前缀</a>之外。
      它会将每个软件包安装到 <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Cellar</a> 目录中各自的 <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">keg</a> 内，
      然后通过符号链接将文件链接到安装前缀，即 Homebrew 的安装路径：
      Apple 芯片 Mac 上为 <code>/opt/homebrew</code>，Linux/WSL 上为 <code>/home/linuxbrew/.linuxbrew</code>，
      Intel Mac 上为 <code>/usr/local</code>。'
    createpackages: Homebrew 软件包分为 <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">formula 和 cask</a>。
