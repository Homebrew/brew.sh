    formulae_title: "\U0001F4E6 Homebrew 软件包"
    formulae: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Formula</a>
      是用于从上游源代码构建命令行工具、程序库和服务的软件包定义。
    formulae_help: <a href="https://github.com/Homebrew/homebrew-core">homebrew/core</a> 中的 formula 在被接受、修改或更新前都必须经过人工审核，
      且必须是采用与 <a href="https://wiki.debian.org/DFSGLicenses">Debian 自由软件指导方针</a>兼容的许可证的开源软件
      （参见<a href="https://docs.brew.sh/Acceptable-Formulae">可接受的 formula </a>中的相关规定）。
      这些 formula 由 Homebrew 的维护者和贡献者共同维护。您可以参考<a href="https://docs.brew.sh/Formula-Cookbook"> formula 编写指南</a>来创建 formlua。
    casks: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Cask</a>
      是用于安装上游预编译二进制文件（例如应用程序、字体和插件）的软件包定义。
    casks_help: 部分 cask 会在 Homebrew 之外<a href="https://docs.brew.sh/Cask-Cookbook#optional-stanzas">自动更新</a>，
      如果希望 Homebrew 也更新这些 cask，请使用 <code>brew upgrade --greedy</code>。
      <a href="https://github.com/Homebrew/homebrew-cask">homebrew/cask</a> 中的 cask 在被接受、修改或更新前都必须经过人工审核，
      并符合<a href="https://docs.brew.sh/Acceptable-Casks">可接受的 Cask</a>中的要求。
      这些 cask 由 Homebrew 的维护者和贡献者共同维护。您可以参考<a href="https://docs.brew.sh/Cask-Cookbook">Cask 编写指南</a>来创建 cask。
    taps: 其他软件包仓库称为 <a href="https://docs.brew.sh/Taps">tap</a>，
      任何人都可以通过它们在官方支持的仓库之外维护自己的 formula 和 cask。
      使用非官方 tap 前，请先了解 <a href="https://docs.brew.sh/Tap-Trust">tap 信任机制</a>的工作原理，
      然后学习如何<a href="https://docs.brew.sh/How-to-Create-and-Maintain-a-Tap">创建和维护 tap</a>。
    bundle_title: "\U0001F4CB Homebrew Bundle"
    bundle: '<a href="https://docs.brew.sh/Brew-Bundle-and-Brewfile">Homebrew Bundle</a> 采用声明式配置：
      使用 <code>Brewfile</code> 描述所需的环境状态。
      运行 <code>brew bundle</code> 即可安装缺失的依赖、更新过时的软件包，
      使项目或计算机的环境配置可以重复部署。'
    bundle_types: Homebrew Bundle 支持 formula、cask、tap、Mac App Store 应用、
      WSL 上的 WinGet 软件包、VSCode 扩展、Go 软件包、Cargo 软件包、uv 工具、
      Flatpak 软件包、krew kubectl 插件，以及通过 <code>brew services</code> 启动后台服务。
