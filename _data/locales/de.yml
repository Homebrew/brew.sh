  subtitle: Der Paketmanager für alle Plattformen
  pagecontent:
    search: Suchen
    language: Sprache
    question: "\U0001F527 Was macht Homebrew?"
    what: Homebrew installiert <a href="https://formulae.brew.sh/formula/" title="List of Homebrew packages">die benötigten Kommandozeilenwerkzeuge und Anwendungen</a> auf macOS, Linux und WSL.
    how: 'Homebrew legt keine Dateien außerhalb seines <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">prefix</a>-Verzeichnisses ab. Es installiert jedes Paket in seinem eigenen <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">keg</a> im <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Cellar</a> und verlinkt die Dateien in das prefix, den Pfad, unter dem Homebrew zu finden ist. Dieser ist <code>/opt/homebrew</code> auf Apple Silicon, <code>/home/linuxbrew/.linuxbrew</code> unter Linux/WSL und <code>/usr/local</code> auf macOS Intel.'
    createpackages: Homebrew-Pakete bestehen aus <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Formulae und Casks</a>.
    formulae_title: "\U0001F4E6 Homebrew-Pakete"
    formulae: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Formulae</a> sind Paketdefinitionen, die es dir ermöglichen, Kommandozeilenwerkzeuge, Bibliotheken und Dienste aus dem Quellcode der Upstream-Projekte zu builden.
    formulae_help: Ein Mensch prüft die Formeln in <a href="https://github.com/Homebrew/homebrew-core">homebrew/core</a>, bevor er sie akzeptiert, ändert oder aktualisiert. Diese müssen quelloffene Software mit einer Lizenz sein, die den <a href="https://wiki.debian.org/DFSGLicenses">Debian Free Software Guidelines</a> entspricht (siehe die Anforderungen in <a href="https://docs.brew.sh/Acceptable-Formulae">Acceptable Formulae</a>). Sie werden von den Homebrew Maintainer und Beitragenden gepflegt. Das <a href="https://docs.brew.sh/Formula-Cookbook">FormulaCookbook</a> unterstützt beim Erstellen von Formeln.
    casks: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Casks</a> sind Paketdefinitionen, die es dir ermöglichen, vorkompilierte Binärdateien von Upstream-Projekten wie Anwendungen, Schriftarten und Plugins zu installieren.
    casks_help: Einige Casks <a href="https://docs.brew.sh/Cask-Cookbook#optional-stanzas">aktualisieren sich selbst</a> unabhängig von Homebrew; benutze <code>brew upgrade --greedy</code>, wenn Homebrew sie ebenfalls aktualisieren soll. Bevor ein Mensch Casks in <a href="https://github.com/Homebrew/homebrew-cask">homebrew/cask</a> akzeptiert, ändert oder aktualisiert, überprüft er sie, und sie müssen die Anforderungen in <a href="https://docs.brew.sh/Acceptable-Casks">Acceptable Casks</a> erfüllen. Sie werden von den Homebrew-Maintainern und Beitragenden gepflegt. Das <a href="https://docs.brew.sh/Cask-Cookbook">Cask Cookbook</a> unterstützt bei der Erstellung von Casks.
    taps: Weitere Paket-Repositories werden als <a href="https://docs.brew.sh/Taps">Taps</a> bezeichnet. Sie ermöglichen es jedem, eigene Formulae und Casks außerhalb der offiziell unterstützten Repositories zu verwalten. Mache dich mit der Funktionsweise von <a href="https://docs.brew.sh/Tap-Trust">Tap-Trust</a> vertraut, bevor du nicht-offizielle Taps verwendest, und erfahre, wie du <a href="https://docs.brew.sh/How-to-Create-and-Maintain-a-Tap">einen Tap erstellst und pflegst</a>.
    bundle_title: "\U0001F4CB Homebrew-Bundle"
    bundle: '<a href="https://docs.brew.sh/Brew-Bundle-and-Brewfile">Homebrew Bundle</a> ist deklarativ: Du beschreibst den gewünschten Zustand mit einem <code>Brewfile</code>. Nutze <code>brew bundle</code>, um fehlende Abhängigkeiten zu installieren, veraltete zu aktualisieren und die Einrichtung von Projekten oder Rechnern reproduzierbar zu gestalten.'
    bundle_types: Homebrew Bundle unterstützt eine Vielzahl von Komponenten, darunter Formulae, Casks, Taps, Apps aus dem Mac App Store, WinGet-Pakete unter WSL, VSCode-Erweiterungen, Go-Pakete, Cargo-Pakete, uv-Tools, Flatpak-Pakete, krew-kubectl-Plugins und das Starten von Hintergrunddiensten mit <code>brew services</code>.
    install:
      install: "\U0001F680 Homebrew installieren"
      paste: Füge dies in dein Terminal von macOS, deine Linux-Shell oder WSL ein.
      supported: Homebrew <a href="https://docs.brew.sh/Support-Tiers">unterstützt</a> macOS (Sonoma 14 und neuer), Linux sowie das Windows Subsystem for Linux (WSL).
      what: Das Skript erläutert, was es tun wird, und stoppt, bevor es beginnt. Informiere dich über weitere <a href="https://docs.brew.sh/Installation">Installationsoptionen</a>.
      pkginstaller: Falls du macOS nutzt, teste unseren <code>.pkg</code>-Installer für interaktive oder unbeaufsichtigte MDM-Installationen.
      githubrelease: Lade es aus dem <a href="https://github.com/Homebrew/brew/releases/latest">aktuellsten GitHub-Release von Homebrew</a> herunter.
    doc:
      resources: "\U0001F4DA Homebrew-Ressourcen"
      documentation: Dokumentation
      man: Schau dir das Homebrew-Handbuch an, indem du <a href="https://docs.brew.sh/Manpage"><code>man brew</code></a> verwendest.
      further: Weitere Dokumentation
      further_summary: Lies die Anleitungen zu <a href="https://docs.brew.sh/Installation">Installation</a>, <a href="https://docs.brew.sh/Troubleshooting">Fehlerbehebung</a>, <a href="https://github.com/Homebrew/brew/blob/HEAD/docs/How-To-Open-a-Homebrew-Pull-Request.md">Zusammenarbeit</a> und <a href="https://docs.brew.sh/Formula-Cookbook">Entwicklung</a>, einschließlich der <a href="https://docs.brew.sh/FAQ">FAQ (Häufig gestellte Fragen)</a> auf <a href="https://docs.brew.sh/">docs.brew.sh</a>.
      donate: "\U0001F4B8 An Homebrew spenden"
      donate_summary: Bei Homebrew handelt es sich um ein gemeinnütziges Projekt, das ausschließlich von Freiwilligen betrieben wird, nicht von Angestellten. Wir benötigen deine Hilfe, um die Kosten für Software, Hardware und Hosting im Zusammenhang mit Continuous Integration und zukünftigen Verbesserungen des Projekts zu decken. Mit jeder Spende wird Homebrew für unsere Nutzer besser. Bitte unterstütze uns regelmäßig über <a href="https://github.com/sponsors/Homebrew">GitHub Sponsors</a>, <a href="https://opencollective.com/homebrew">Open Collective</a> oder <a href="https://www.patreon.com/homebrew">Patreon</a>. Das <a href="https://opencollective.com/opensource">Open Source Collective</a> fungiert als Träger in steuerlichen Angelegenheiten.
      blog: Homebrew-Blog
      blog_latest_post: Neuester Beitrag
      blog_summary: Schau im <a href="/blog/">Homebrew-Blog</a> nach, um Versionshinweise, Projekt-Updates und Ankündigungen zu erhalten.
      community: Hilfe erhalten
      community_summary: Hast du eine Frage oder bist dir unsicher, wo du ein Problem melden kannst? Sieh dir zunächst die <a href="https://github.com/orgs/Homebrew/discussions">Diskussionen</a> von Homebrew an oder verwende das <a href="https://github.com/Homebrew/brew/issues/new/choose">Formular für neue Issues</a>.
      social: Soziale Medien
      social_summary: Folge Homebrew auf <a href="https://fosstodon.org/@homebrew">Mastodon</a>, <a href="https://bsky.app/profile/brew.sh">Bluesky</a> oder <a href="https://x.com/MacHomebrew">𝕏 (Twitter)</a> oder abonniere den <a href="https://buttondown.email/homebrew">Newsletter</a>.
      formulae: Homebrew-Pakete
