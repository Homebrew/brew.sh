      analytics: Analysedaten
      analytics_summary: Schau dir anonymisierte Daten zur Verwendung von Installationen, Builds und Betriebssystemen auf <a href="https://formulae.brew.sh/analytics/">formulae.brew.sh/analytics</a> an. Lies, wie Homebrew <a href="https://docs.brew.sh/Analytics">Anonymous Analytics</a> nutzt.
