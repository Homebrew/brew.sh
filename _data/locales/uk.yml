      donate: "\U0001F4B8 Зробити пожертву Homebrew"
      donate_summary: Homebrew — некомерційний проєкт, який повністю підтримується волонтерами, а не найманими співробітниками.
        Нам потрібні кошти, щоб платити за програмне та апаратне забезпечення, хостинг CI та майбутні покращення проєкту.
        Кожну пожертву буде використано, щоб покращити Homebrew для наших користувачів. Ти можеш розглянути
        можливість робити регулярні пожертви через <a href="https://github.com/sponsors/Homebrew">GitHub Sponsors</a>,
        <a href="https://opencollective.com/homebrew">Open Collective</a> або
        <a href="https://www.patreon.com/homebrew">Patreon</a>. Фіскально Homebrew є частиною
        <a href="https://opencollective.com/opensource">Open Source Collective</a>.
      blog: Блог Homebrew
      blog_latest_post: останній пост
      blog_summary: Читай <a href="/blog/">блог Homebrew</a>, щоб дізнаватися про зміни, оновлення проєкту та оголошення.
      community: Отримати допомогу
      community_summary: Маєш питання або не знаєш, куди звернутися за допомогою?
        Почни з <a href="https://github.com/orgs/Homebrew/discussions">обговорення</a> Homebrew
