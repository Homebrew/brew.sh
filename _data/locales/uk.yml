uk:
  locale_name: Українська
  subtitle: Менеджер пакетів для усіх платформ
  pagecontent:
    search: Пошук
    language: Мова
    question: "\U0001F527 Що робить Homebrew?"
    what: Homebrew встановлює <a href="https://formulae.brew.sh/formula/" title="Список пакетів Homebrew">консольні утиліти і застосунки, які вам потрібні</a> на
      macOS, Linux та WSL.
    how: 'Homebrew не буде встановлювати файли поза межами свого <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">префікса (англ. prefix)</a>.
      Кожен пакет інсталюється у свою власну <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">кегу (англ. keg)</a>
      всередині <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">cеллара (англ. Cellar)</a>,
      потім залишає символьне посилання на свої файли в префіксі, шляху, за яким встановлено Homebrew:
      <code>/opt/homebrew</code> на Apple Silicon, <code>/home/linuxbrew/.linuxbrew</code>
      на Linux/WSL і <code>/usr/local</code> на macOS Intel.'
    createpackages: Пакети Homebrew — це <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">формули (англ. formulae)
      та каски (англ. casks)</a>.
    formulae_title: "\U0001F4E6 Пакети Homebrew"
    formulae: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Формули</a>
      це пакети, які компілюють інструменти, бібліотеки та утиліти для командного рядка з вихідного коду.
    formulae_help: Формули в <a href="https://github.com/Homebrew/homebrew-core">homebrew/core</a>
      потребують перевірки людиною, перш ніж вони будуть прийняті, відредаговані або оновлені, і повинні
      бути програмним забезпеченням з відкритим вихідним кодом та ліцензією, що сумісна з
      <a href="https://wiki.debian.org/DFSGLicenses">Debian Free Software Guidelines</a> (див. вимоги в <a
      href="https://docs.brew.sh/Acceptable-Formulae">Acceptable Formulae</a>). Вони підтримуються мейнтейнерами
      та контриб’юторами Homebrew. У створенні формул вам допоможе <a href="https://docs.brew.sh/Formula-Cookbook">Formula Cookbook</a>.
    casks: <a href="https://docs.brew.sh/Formula-Cookbook#homebrew-terminology">Каски</a>
      це пакети, які встановлюють попередньо створені бінарні файли, такі як застосунки, шрифти та плагіни.
    casks_help: Деякі каски <a href="https://docs.brew.sh/Cask-Cookbook#stanza-auto_updates">оновлюються самостійно</a>,
      без допомоги Homebrew, тому використовуй <code>brew upgrade --greedy</code> якщо бажаєш, щоб Homebrew
      Їх також оновлював. Каскам в <a href="https://github.com/Homebrew/homebrew-cask">homebrew/cask</a>
      потрібна перевірка людиною перш ніж вони будуть прийняті, відредаговані або оновлені, і повинні відповідати вимогам
      (див. <a href="https://docs.brew.sh/Acceptable-Casks">Acceptable
      Casks</a>). Вони підтримуються мейнтейнерами та контриб’юторами Homebrew. Щоб створити каски,
      звернись до <a href="https://docs.brew.sh/Cask-Cookbook">Cask Cookbook</a>.
    taps: Інші репозиторії пакетів називаються <a href="https://docs.brew.sh/Taps">тапами (англ. taps)</a>;
      вони дозволяють будь-кому підтримувати свої власні формули та каски поза межами офіційно підтримуваних
      репозиторіїв. Перш ніж використовувати неофіційний репозиторій, почитай, як працює
      <a href="https://docs.brew.sh/Tap-Trust">taptrust</a>. Більше про створення та підтримку
      свого тапа читай в статті <a href="https://docs.brew.sh/How-to-Create-and-Maintain-a-Tap">How to Create and Maintain a Tap</a>.
    bundle_title: "\U0001F4CB Homebrew Bundle"
    bundle: '<a href="https://docs.brew.sh/Brew-Bundle-and-Brewfile">Homebrew Bundle</a>
      надає декларативний засіб контролю пакетами: він використовує <code>Brewfile</code> для опису бажаного стану.
      Використовуй команду <code>brew bundle</code>, щоб інсталювати відсутні залежності, оновити застарілі та забезпечити
      налаштування середовища проєкту або нового комп’ютера.'
    bundle_types: Homebrew Bundle підтримує формули, каски, тапи, застосунки з Mac App Store,
      пакети WinGet на WSL, розширення VSCode, пакети Go, пакети Cargo, інструменти uv,
      пакети Flatpak, плагіни krew kubectl та запуск фонових служб за допомогою
      <code>brew services</code>.
    install:
      install: "\U0001F680 Інсталяція Homebrew"
      paste: Встав це в термінал macOS, Linux або WSL.
      what: Перед встановленням скрипт пояснить дії, які він збирається виконати.
        Інші методи інсталяції можна знайти <a href="https://docs.brew.sh/Installation">тут</a>.
      pkginstaller: Якщо ти використовуєш macOS, спробуй наш інсталятор <code>.pkg</code> для інтерактивної або автоматичної інсталяції за допомогою MDM.
      githubrelease: Завантаж його з останнього релізу на GitHub з <a href="https://github.com/Homebrew/brew/releases/latest">Homebrew</a>.
      supported: Homebrew <a href="https://docs.brew.sh/Support-Tiers">підтримує</a>
        macOS (Sonoma 14 або новіші), Linux та Windows Subsystem for Linux (WSL).
    doc:
      resources: "\U0001F4DA Ресурси Homebrew"
      documentation: Документація
      man: Почитати посібник Homebrew можна за допомогою <a href="https://docs.brew.sh/Manpage"><code>man
